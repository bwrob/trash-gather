name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (LLVM tooling, Just & Google Benchmark)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang clang-format clang-tidy just libbenchmark-dev pkg-config

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Run Pre-commit Checks (Ruff, Pyrefly, Clang-Format, Docs)
        run: uv run pre-commit run --all-files

      - name: Run Static Analysis (clang-tidy)
        # clang-tidy is not in pre-commit (too slow)
        run: just lint-c

      - name: Run Unit Tests
        run: just test

      - name: Build Main Binary
        run: just build

      - name: Verify Benchmark Build
        run: just bench-build

      - name: Measure Code Coverage (gcov)
        run: just coverage
