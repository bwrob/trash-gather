name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (LLVM tooling & Just)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang-format clang-tidy just



      - name: Check Code Formatting (clang-format)
        run: just format-check

      - name: Run Static Analysis (clang-tidy)
        run: just lint

      - name: Build Main Binary
        run: just build

      - name: Run Test Suite (µnit + ASan + bootlib)
        run: just test

      - name: Measure Code Coverage (gcov)
        run: just coverage
