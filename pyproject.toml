[project]
name = "trash-gather"
version = "0.1.0"
description = "C garbage collector & VM runtime — explorations in automatic memory management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pre-commit>=4.6.2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Enable: pycodestyle (E/W), pyflakes (F), isort (I), bugbear (B),
#         simplify (SIM), naming (N), pyupgrade (UP)
select = ["E", "W", "F", "I", "B", "SIM", "N", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
# Only check project scripts, not vendor/venv
project-includes = ["scripts/**/*.py"]
search-path = ["scripts"]
preset = "strict"

[dependency-groups]
dev = [
    "mdformat>=1.0.0",
    "mdformat-frontmatter>=2.1.2",
    "mdformat-gfm>=1.0.0",
    "pre-commit>=4.6.2",
    "pyrefly>=1.2.0",
    "ruff>=0.16.6",
    "taplo>=0.9.3",
]
