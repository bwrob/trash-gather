repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check scripts/
        language: system
        pass_filenames: false
        files: ^scripts/.*\.py$

      - id: clang-format
        name: clang-format
        entry: just format-c-check
        language: system
        pass_filenames: false
        files: \.(c|h|cpp)$

      - id: mdformat
        name: mdformat
        entry: uv run mdformat --check README.md AGENTS.md lessons .agents
        language: system
        pass_filenames: false
        files: \.md$

      - id: taplo
        name: taplo format
        entry: uv run taplo format --check
        language: system
        pass_filenames: false
        files: \.toml$

      - id: lint-docs
        name: lint docstrings
        entry: just lint-docs
        language: system
        pass_filenames: false
        files: \.(c|h|cpp)$
