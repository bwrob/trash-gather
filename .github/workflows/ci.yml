name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (LLVM tooling, Just & Google Benchmark)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang-format clang-tidy just libbenchmark-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Run Pre-commit Checks (Ruff, Pyrefly, Clang-Format, Docs, Tests)
        run: uv run pre-commit run --all-files

      - name: Run Static Analysis (clang-tidy)
        # clang-tidy is not in pre-commit (too slow); lint-docs/tests are already run above
        run: just lint-c

      - name: Build Main Binary
        run: just build

      - name: Verify Benchmark Build
        run: just bench-objs

      - name: Measure Code Coverage (gcov)
        run: just coverage
